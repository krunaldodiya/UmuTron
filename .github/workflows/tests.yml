name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native Python bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo gir1.2-gtk-4.0 gir1.2-adw-1
      - name: Test isolated core fixtures
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Compile application
        run: /usr/bin/python3 -m compileall -q game_library
